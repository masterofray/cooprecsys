[tqdm]
# Progress bar colour (hex or named colour).
colour            = #05ad46
# Width of the progress bar in columns.
ncols             = 200
BarFormats        = {desc:30}: {percentage:3.0f}%%|{bar:60}| {n_fmt}/{total_fmt} [{elapsed}<{remaining}, {rate_fmt}]

[SHAP]
SubjectID         = CustomerID
rowID             = [2,40,100,220]
numfeats          = 9
MaxFeatTabel      = 20
FeatTableColumn   = ['ProductName_enc', 'ProductPrice', 'Discount', 'Quantity', 'Class_enc', 'SalesDate_is_weekend', 'VitalityDays', 'CityName_enc', 'rank']
UseRandomColumn   = True

[model]
# Default NumPy dtype for sparse matrix values fed into Cython kernels.
dtype             = float32
# Default number of latent components.
no_components     = 10
# Default loss function: logistic | warp | bpr | warp-kos
loss              = warp
# Default learning schedule: adagrad | adadelta
learning_schedule = adagrad
# Default number of training epochs.
epochs            = 10
# Default OpenMP thread count (>= 1).
num_threads       = 4

[duckdb]
# Number of threads for DuckDB in-process queries.
threads           = 8

[logging]
# Root logging level: DEBUG | INFO | WARNING | ERROR
level             = WARNING
OptunaLevel       = WARNING

# =============================================================================
# LightGBM LTR Framework — Configuration File
# =============================================================================

[FEATURES]
# Comma-separated list of feature column names.
# Override at runtime via LTRConfig.from_ini() or CLI args.
label                  = reordered
query_id               = user_id
remove_column          = True
top_importances        = 10

[MODEL_LGBM]
model_path             = artifacts/models/lightgbm_ltr_model.txt
experiment_name        = LightGBM_LTR
large_data_threshold   = 10000
seed                   = 4
num_histbin            = 9

[TRAINING]
num_boost_round        = 1000
early_stopping_rounds  = 200
log_evaluation         = 50

# Default LambdaRank parameters (overridden by Bayesian tuning)
objective              = lambdarank
metric                 = ndcg
ndcg_eval_at           = 5,10
learning_rate          = 0.05
num_leaves             = 63
max_depth              = 6
feature_fraction       = 0.8
bagging_fraction       = 0.8
bagging_freq           = 5
lambda_l1              = 0.1
lambda_l2              = 0.1
n_jobs                 = -1
verbosity              = -1

[TUNING]
n_trials               = 10
timeout                = 3600
direction              = maximize
study_name             = lgbm_ltr_study
run_mlflow             = False
# sampler: tpe | random | cmaes
sampler                = tpe
# pruner:  median | hyperband | none
pruner                 = median

[INFERENCE]
top_k                  = 25
score_col              = relevance_score
parquet                = True

#Choose 'quantile' or 'min'
scoremode              = quantile

[PATHS]
output_dir             = artifacts/
mlflow_tracking_uri    = artifacts/models/mlruns
html_report_path       = artifacts/reports/report.html
labelcoder             = artifacts/models/labelcoder


[FALLBACK]
# Strategy
strategy              = content
fallback_score_mode   = min
fallback_score_value  = 0.0
fallback_score_quantile = 0.05
max_candidates_scan   = 5000
diversity_weight      = 0.0
random_state          = 42
top_k                 = 20
item_id_col           = ProductName_enc

# ANN (Approximate Nearest Neighbour)
use_ann               = True
ann_threshold         = 50000
ann_library           = faiss
use_gpu               = False

# Vector Caching
cache_dir             = ./vector_cache
cache_key             = fallback_v1

# Cold-Start
cold_start_threshold  = 5
cold_start_strategy   = popularity

# A/B Testing
mark_fallback         = True

# DuckDB & Parallel Processing
use_duckdb            = True
n_jobs                = -1
batch_size            = auto