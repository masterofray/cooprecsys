[tqdm]
# Progress bar colour (hex or named colour).
colour = #05ad46
# Width of the progress bar in columns.
ncols = 88

[model]
# Default NumPy dtype for sparse matrix values fed into Cython kernels.
dtype = float32
# Default number of latent components.
no_components = 10
# Default loss function: logistic | warp | bpr | warp-kos
loss = warp
# Default learning schedule: adagrad | adadelta
learning_schedule = adagrad
# Default number of training epochs.
epochs = 10
# Default OpenMP thread count (>= 1).
num_threads = 4

[duckdb]
# Number of threads for DuckDB in-process queries.
threads = 8

[logging]
# Root logging level: DEBUG | INFO | WARNING | ERROR
level = WARNING
