[tqdm]
colour = #05ad46
ncols  = 88
BarFormats = {l_bar}{bar}|{n_fmt}/{total_fmt} [{elapsed}<{remaining}, {rate_fmt}{postfix}]

[model]
loss              = warp
no_components     = 10
learning_schedule = adagrad
epochs            = 10
num_threads       = 4
dtype             = float32

[duckdb]
threads = 4

[logging]
level = DEBUG

[paths]
model_save_path = ./models/arycolbring/saved/
report_path     = ./reports/arycolbring/
