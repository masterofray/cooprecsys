[build-system]
requires = [
    "setuptools>=61",
    "wheel",
    "cython>=0.29",
    "numpy>=1.21",
]
build-backend = "setuptools.backends.legacy:build"

[project]
name            = "arycolbring"
version         = "0.1.0"
description     = "Ultra-optimised user-to-item collaborative filtering (Cython + OpenMP)"
readme          = "README.md"
requires-python = ">=3.8"
authors         = [{ name = "aryanto" }]
license         = { text = "MIT" }

keywords = [
    "collaborative-filtering",
    "recommendation",
    "machine-learning",
    "cython",
    "sparse-matrix",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Cython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "pandas>=1.3",
    "duckdb>=0.8",
    "tqdm>=4.60",
    "joblib>=1.1",
    "cython>=0.29",
    "seaborn>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
]

[tool.setuptools.packages.find]
where   = ["."]
include = ["arycolbring*"]

[tool.setuptools.package-data]
"arycolbring"    = ["config.ini"]
"arycolbring.cy" = ["*.pxd", "*.pyx"]

[tool.pytest.ini_options]
testpaths    = ["tests"]
addopts      = "-v --tb=short"
log_cli      = true
log_cli_level = "DEBUG"

[tool.cython-lint]
max-line-length = 120
