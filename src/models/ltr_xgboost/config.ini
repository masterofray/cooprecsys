[database]
db_path = ./data/instacart.db
query = SELECT * FROM FullTrainData

[output]
output_dir = ./output
model_save_path = ./output/model.xgb
metrics_db_path = ./output/metrics.db

[model]
batch_size = 1000
top_k = 10
eval_k = 10

[hyperparams]
max_depth = 6
learning_rate = 0.1
subsample = 0.8
colsample_bytree = 0.8
epochs = 100
early_stopping = 10
objective = rank:ndcg
metric = ndcg@10

[data]
train_ratio = 0.8
val_ratio = 0.1
test_ratio = 0.1
normalize = true
create_interactions = true
missing_value_strategy = mean

[mlflow]
experiment_name = xgboost_ltr
tracking_uri = file:./mlruns
artifact_path = ./artifacts

[visualization]
figsize_width = 14
figsize_height = 8
dpi = 300
color_palette = Set2

[logging]
level = INFO
format = %(asctime)s - %(name)s - %(levelname)s - %(message)s