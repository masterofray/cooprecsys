[database]
db_path=./data/recommender.db
batch_size=10000
max_workers=4

[model]
model_type=xgboost_ranker
random_state=42
max_depth=7
learning_rate=0.1
n_estimators=200
num_leaves=31
objective=rank:ndcg

[training]
test_split=0.2
validation_split=0.1
early_stopping_rounds=10
verbose=True

[data_processing]
min_interactions=2
max_features=100
cache_dir=./cache
use_cython=True

[mlflow]
tracking_uri=./mlruns
experiment_name=XGBoost_LTR_Recommender
run_name=production_run

[visualization]
output_dir=./plots
dpi=300
style=seaborn

[explainability]
shap_sample_size=1000
top_features=10
