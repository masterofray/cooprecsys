name: Build Wheel for PyPi

on:
  push:
    branches:
      - master
      - dev
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - master
      - dev
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.0.2 (blank = build-only run)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  PIP_NO_INPUT: "1"
  CYTHON_COVERAGE: "0"

jobs:
  # ---------------------------------------------------------------------
  # Create Tag / Release Decision
  # ---------------------------------------------------------------------
  create-tag:
    name: "Create Tag (Release and Tag)"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name || steps.tagpush.outputs.tag_name }}
      is_release: ${{ steps.tag.outputs.is_release || steps.tagpush.outputs.is_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Passthrough — already a tag push
        id: tagpush
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          echo "tag_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "is_release=true" >> "$GITHUB_OUTPUT"

      - name: Create & push annotated tag
        id: tag
        if: |
          !startsWith(github.ref, 'refs/tags/v') &&
          (
            (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '') ||
            (github.event_name == 'push' && contains(github.event.head_commit.message, 'Release and Tag'))
          )
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"

          if [ -z "$VERSION" ]; then
            MSG=$(git log -1 --pretty=%B)
            VERSION=$(echo "$MSG" | grep -oiE "release and tag[[:space:]]+v?[0-9]+\.[0-9]+(\.[0-9]+)?" | grep -oE "[0-9]+\.[0-9]+(\.[0-9]+)?" | head -n1)
          fi

          if [ -z "$VERSION" ]; then
            VERSION=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"(.*)".*/\1/')
          fi

          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine a version to tag. Use 'Release and Tag vX.Y.Z' in the commit message, the workflow_dispatch 'version' input, or set version in pyproject.toml."
            exit 1
          fi

          TAG="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::warning::Tag $TAG already exists locally/remotely — reusing it, no new tag pushed."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "is_release=true" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # Build sdist
  # ---------------------------------------------------------------------
  build-sdist:
    name: Build sdist (tar.gz)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: [create-tag]
    if: ${{ !cancelled() && !failure() }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-tag.outputs.tag_name || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Build sdist via uv
        run: uv build --sdist --out-dir dist/

      - name: List sdist
        run: ls -lh dist/

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------
  # Wheels — Ubuntu
  # ---------------------------------------------------------------------
  build-wheels-ubuntu:
    name: Build wheel (ubuntu-latest / py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: [create-tag]
    if: ${{ !cancelled() && !failure() }}
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-tag.outputs.tag_name || github.ref }}
          fetch-depth: 0

      - name: Install C Toolchain & OpenMP
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo systemctl stop apt-daily.timer || true
          sudo systemctl stop apt-daily-upgrade.timer || true
          sudo systemctl stop unattended-upgrades || true
          sudo apt-get clean
          sudo apt-get update -y
          sudo apt-get install -y build-essential libgomp1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Create uv cache directory
        run: mkdir -p "${{ env.UV_CACHE_DIR }}"

      - name: Install build dependencies via uv
        run: |
          uv pip install --system \
            "setuptools>=70.0" \
            "wheel>=0.42" \
            "cython>=3.0" \
            "numpy>=1.21" \
            build

      - name: Verify GCC/OpenMP
        run: |
          gcc --version
          g++ --version

      - name: Build Cython Extensions (AryColBring & Ary2Tower)
        run: |
          if [ -f "./src/cooprecsys/models/arycolbring/cysetup.py" ]; then
            python ./src/cooprecsys/models/arycolbring/cysetup.py build_ext --inplace
          elif [ -f "./src/models/arycolbring/cysetup.py" ]; then
            python ./src/models/arycolbring/cysetup.py build_ext --inplace
          fi

          if [ -f "./src/cooprecsys/models/ary2tower/a2tcysetup.py" ]; then
            python ./src/cooprecsys/models/ary2tower/a2tcysetup.py build_ext --inplace
          elif [ -f "./src/models/ary2tower/a2tcysetup.py" ]; then
            python ./src/models/ary2tower/a2tcysetup.py build_ext --inplace
          fi

      - name: Inspect Workspace Tree Before Wheel Build
        run: |
          sudo apt-get update -y && sudo apt-get install -y tree
          echo "=== Workspace Tree (src level) ==="
          tree -L 3 src/

      - name: Build wheel via uv (with fallback)
        shell: bash
        run: |
          echo "=== [1/3] Attempting wheel build via uv ==="
          if uv build --wheel --no-build-isolation --out-dir dist/; then
            echo "Successfully built wheel using uv!"
          else
            echo "::warning::'uv build' failed. Falling back to 'python -m build'..."
            
            echo "=== [2/3] Attempting wheel build via PyPA build ==="
            if python -m build --wheel --no-isolation --outdir dist/; then
              echo "Successfully built wheel using python -m build!"
            else
              echo "::warning::'python -m build' failed. Falling back to 'pip wheel'..."
              
              echo "=== [3/3] Attempting wheel build via pip wheel ==="
              python -m pip wheel . --no-build-isolation --no-deps --wheel-dir dist/
            fi
          fi

      - name: List generated artifacts & inspect wheel
        run: |
          ls -lh dist/
          echo "========================================="
          echo "INSPECTING WHEEL CONTENTS:"
          echo "========================================="
          for f in dist/*.whl; do
            echo "--- $f ---"
            python -m zipfile -l "$f"
          done

      - name: Upload wheel as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-ubuntu-latest-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------
  # Wheels — Windows
  # ---------------------------------------------------------------------
  build-wheels-windows:
    name: Build wheel (windows-latest / py${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 8
    needs: [create-tag]
    if: ${{ !cancelled() && !failure() }}
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-tag.outputs.tag_name || github.ref }}
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Create uv cache directory
        shell: bash
        run: mkdir -p "${{ env.UV_CACHE_DIR }}"

      - name: Install build dependencies via uv
        shell: bash
        run: |
          uv pip install --system \
            "setuptools>=70.0" \
            "wheel>=0.42" \
            "cython>=3.0" \
            "numpy>=1.21" \
            build

      - name: Set up MSVC Developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Verify MSVC toolchain
        shell: pwsh
        run: |
          python -c "import setuptools; print('setuptools:', setuptools.__version__)"
          $cl = Get-Command cl.exe -ErrorAction SilentlyContinue
          if ($cl) { Write-Host "cl.exe resolved: $($cl.Source)" } else { Write-Error "cl.exe still not on PATH after msvc-dev-cmd setup." }

      - name: Build Cython Extensions (AryColBring & Ary2Tower)
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          if (Test-Path "./src/cooprecsys/models/arycolbring/cysetup.py") {
            python ./src/cooprecsys/models/arycolbring/cysetup.py build_ext --inplace
          } elseIf (Test-Path "./src/models/arycolbring/cysetup.py") {
            python ./src/models/arycolbring/cysetup.py build_ext --inplace
          }

          if (Test-Path "./src/cooprecsys/models/ary2tower/a2tcysetup.py") {
            python ./src/cooprecsys/models/ary2tower/a2tcysetup.py build_ext --inplace
          } elseIf (Test-Path "./src/models/ary2tower/a2tcysetup.py") {
            python ./src/models/ary2tower/a2tcysetup.py build_ext --inplace
          }

      - name: Build wheel via uv (with fallback)
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          echo "=== [1/3] Attempting wheel build via uv ==="
          if uv build --wheel --no-build-isolation --out-dir dist/; then
            echo "Successfully built wheel using uv!"
          else
            echo "::warning::'uv build' failed. Falling back to 'python -m build'..."
            
            echo "=== [2/3] Attempting wheel build via PyPA build ==="
            if python -m build --wheel --no-isolation --outdir dist/; then
              echo "Successfully built wheel using python -m build!"
            else
              echo "::warning::'python -m build' failed. Falling back to 'pip wheel'..."
              
              echo "=== [3/3] Attempting wheel build via pip wheel ==="
              python -m pip wheel . --no-build-isolation --no-deps --wheel-dir dist/
            fi
          fi

      - name: List generated artifacts & inspect wheel
        shell: bash
        run: |
          ls -lh dist/
          echo "========================================="
          echo "INSPECTING WHEEL CONTENTS:"
          echo "========================================="
          for f in dist/*.whl; do
            echo "--- $f ---"
            python -m zipfile -l "$f"
          done

      - name: Upload wheel as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows-latest-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------
  # Test — Ubuntu
  # ---------------------------------------------------------------------
  test-ubuntu:
    name: Test Installed Wheel (ubuntu-latest / py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: [create-tag, build-wheels-ubuntu]
    if: always() && needs.build-wheels-ubuntu.result == 'success'
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-tag.outputs.tag_name || github.ref }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Download matching wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-ubuntu-latest-py${{ matrix.python-version }}
          path: dist/

      - name: Resolve wheel filename
        id: wheel_info
        shell: bash
        run: |
          WHEEL_FILE=$(ls -1 dist/*.whl | head -n 1)
          if [ -z "$WHEEL_FILE" ]; then
            echo "ERROR: No wheel file found in dist/"
            ls -la dist/
            exit 1
          fi
          echo "wheel_file=$WHEEL_FILE" >> "$GITHUB_OUTPUT"
          echo "Resolved wheel: $WHEEL_FILE"

      - name: Inspect wheel structure and binary (.so) files
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y && sudo apt-get install -y tree

          echo "=== 1. Summary File Binary (.so) & Config (.ini) ==="
          unzip -l "${{ steps.wheel_info.outputs.wheel_file }}" | grep -E '\.so|\.ini' || echo "WARNING: No .so or .ini files found!"

          echo -e "\n=== 2. Detailed Tree Structure ==="
          mkdir -p /tmp/whl_contents
          unzip -q "${{ steps.wheel_info.outputs.wheel_file }}" -d /tmp/whl_contents

          tree /tmp/whl_contents

          rm -rf /tmp/whl_contents

      - name: Create isolated test environment via uv
        shell: bash
        run: uv venv test_env --python ${{ matrix.python-version }}

      - name: Install wheel into isolated environment
        run: |
          source test_env/bin/activate
          uv pip install "${{ steps.wheel_info.outputs.wheel_file }}"
          uv pip show cooprecsys
          python -c "import cooprecsys; print('SUCCESS:', cooprecsys.__file__)"

      - name: Install test dependencies
        run: |
          source test_env/bin/activate
          uv pip install pytest pytest-cov

  # ---------------------------------------------------------------------
  # Test — Windows
  # ---------------------------------------------------------------------
  test-windows:
    name: Test Installed Wheel (windows-latest / py${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 8
    needs: [create-tag, build-wheels-windows]
    if: always() && needs.build-wheels-windows.result == 'success'
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-tag.outputs.tag_name || github.ref }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Download matching wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-windows-latest-py${{ matrix.python-version }}
          path: dist/

      - name: Resolve wheel filename
        id: wheel_info
        shell: bash
        run: |
          WHEEL_FILE=$(ls -1 dist/*.whl | head -n 1)
          if [ -z "$WHEEL_FILE" ]; then
            echo "ERROR: No wheel file found in dist/"
            ls -la dist/
            exit 1
          fi
          echo "wheel_file=$WHEEL_FILE" >> "$GITHUB_OUTPUT"
          echo "Resolved wheel: $WHEEL_FILE"

      - name: Create isolated test environment via uv
        shell: bash
        run: uv venv test_env --python ${{ matrix.python-version }}

      - name: Install wheel into isolated environment
        shell: bash
        run: |
          source test_env/Scripts/activate
          echo "::notice::Windows: installing cooprecsys with --no-deps (scann has no win_amd64 wheel)."
          uv pip install --no-deps "${{ steps.wheel_info.outputs.wheel_file }}"
          uv pip show cooprecsys
          python -c "import cooprecsys; print('SUCCESS:', cooprecsys.__file__)"

      - name: Install test dependencies
        shell: bash
        run: |
          source test_env/Scripts/activate
          uv pip install pytest pytest-cov

  # ---------------------------------------------------------------------
  # Publish wheels + sdist to GitHub Release
  # ---------------------------------------------------------------------
  publish:
    name: Publish to Release
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: [create-tag, build-sdist, test-ubuntu, test-windows]
    if: |
      always() &&
      needs.create-tag.outputs.is_release == 'true' &&
      needs.build-sdist.result == 'success' &&
      needs.test-ubuntu.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: dist-sdist
          path: dist/

      - name: Download Ubuntu wheels compilation
        uses: actions/download-artifact@v4
        with:
          pattern: dist-ubuntu-latest-py*
          path: dist/
          merge-multiple: true

      - name: Download Windows wheels (only if Windows tests passed)
        if: needs.test-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: dist-windows-latest-py*
          path: dist/
          merge-multiple: true

      - name: Note Windows exclusion
        if: needs.test-windows.result != 'success'
        run: echo "::warning::Windows wheels were NOT included in this release because the Windows test job did not succeed (result=${{ needs.test-windows.result }}). Releasing with Ubuntu wheels + sdist only."

      - name: List final release artifacts
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-tag.outputs.tag_name }}
          files: |
            dist/*.whl
            dist/*.tar.gz
          pyproject: false
          draft: false
          prerelease: ${{ contains(needs.create-tag.outputs.tag_name, 'rc') || contains(needs.create-tag.outputs.tag_name, 'beta') || contains(needs.create-tag.outputs.tag_name, 'alpha') }}
          generate_release_notes: true

      - name: Release summary
        run: |
          echo "Release published successfully for tag: ${{ needs.create-tag.outputs.tag_name }}"
          echo "Windows wheels included: ${{ needs.test-windows.result == 'success' }}"
          echo "Sdists published: $(ls -1 dist/*.tar.gz | wc -l)"
          echo "Wheels published: $(ls -1 dist/*.whl | wc -l)"