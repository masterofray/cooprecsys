name: CoopRecSys Package Publisher

on:
  release:
    types:
      - published

  workflow_dispatch:
    inputs:
      tag:
        description: "GitHub Release tag to publish to PyPI, e.g. v0.0.2"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-publish-${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GitHub Release artifacts to PyPI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Release Tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail

          TAG="${RELEASE_TAG}"

          if [[ -z "$TAG" ]]; then
            echo "::error::Release tag is empty."
            exit 1
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "::error::Invalid release tag: $TAG"
            exit 1
          fi

          echo "Publishing release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Twine
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade twine

      - name: Download GitHub Release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.whl" \
            --pattern "*.tar.gz" \
            --dir dist

      - name: Inspect release artifacts
        run: |
          set -euo pipefail
          ls -lah dist/

          WHEEL_COUNT=$(find dist -maxdepth 1 -type f -name "*.whl" | wc -l)
          SDIST_COUNT=$(find dist -maxdepth 1 -type f -name "*.tar.gz" | wc -l)

          if [ "$WHEEL_COUNT" -eq 0 ]; then
            echo "::error::No wheel artifacts found."
            exit 1
          fi

          if [ "$SDIST_COUNT" -eq 0 ]; then
            echo "::error::No source distribution found."
            exit 1
          fi

      - name: Verify Linux wheel tags
        shell: bash
        run: |
          set -euo pipefail
          found=0

          for whl in dist/*manylinux*.whl; do
            [ -f "$whl" ] || continue
            found=1

            case "$(basename "$whl")" in
              *manylinux_2_28_x86_64.whl)
                echo "OK: $(basename "$whl")"
                ;;
              *)
                echo "::error::Unexpected Linux wheel tag: $(basename "$whl")"
                exit 1
                ;;
            esac
          done

          if [ "$found" -eq 0 ]; then
            echo "::error::No manylinux_2_28 Linux wheel found."
            exit 1
          fi

      - name: Validate package with Twine
        run: |
          python -m twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m twine upload \
            --skip-existing \
            dist/*

      - name: Release Summary
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          echo "=================================================="
          echo "CoopRecSys PyPI Release Completed"
          echo "=================================================="
          echo "GitHub Release : $TAG"
          echo "Package        : cooprecsys"
          echo "Python         : 3.10 - 3.13"
          echo "Linux ABI      : manylinux_2_28_x86_64"
          echo "Repository     : $GITHUB_REPOSITORY"
          echo "=================================================="
