name: CoopRecSys Package Publisher

on:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  publish:
    if: startsWith(github.event.head_commit.message, 'release:')
    name: Build, Test and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup UV
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Verify Environment
        run: |
          echo "=================================================="
          echo "[STEP 1/8] Verify Environment"
          echo "=================================================="
          python --version
          uv --version

      - name: Install Build Tools
        run: |
          echo "=================================================="
          echo "[STEP 2/8] Install Build Tools"
          echo "=================================================="
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            g++

      - name: Build AryColBring Cython Extensions
        working-directory: ./src/models/arycolbring
        run: |
          echo "=================================================="
          echo "[STEP 3/8] Build Cython Extensions"
          echo "=================================================="
          uv pip install --system \
          numpy \
          cython \
          setuptools \
          wheel
          chmod +x ./cysetup.sh
          bash ./cysetup.sh

      - name: Install Project Dependencies
        run: |
          echo "=================================================="
          echo "[STEP 4/8] Install Dependencies"
          echo "=================================================="
          uv pip install --system -e ".[dev,test]"

      #- name: Run Unit Tests
      #  run: |
      #    echo "=================================================="
      #    echo "[STEP 5/8] Run Tests"
      #    echo "=================================================="
      #
      #    pytest

      - name: Build Package
        run: |
          echo "=================================================="
          echo "[STEP 6/8] Build Package"
          echo "=================================================="
          uv build

      - name: Verify Wheel Installation
        run: |
          uv venv test_env
          source test_env/bin/activate
          uv pip install dist/*.whl
          python -c "
          import cooprecsys
          print('SUCCESS: cooprecsys imported')
          print(cooprecsys.__file__)"

      - name: Validate Package
        run: |
          echo "=================================================="
          echo "[STEP 7/8] Validate Package"
          echo "=================================================="
          python -m pip install --upgrade twine
          twine check dist/*

          echo ""
          echo "Generated Files:"
          ls -lah dist/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cooprecsys-distribution
          path: |
            dist/*.whl
            dist/*.tar.gz
          retention-days: 14

      - name: Publish To PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          echo "=================================================="
          echo "[STEP 8/8] Publish To PyPI"
          echo "=================================================="
          python -m pip install --upgrade twine
          twine upload \
            --skip-existing \
            dist/*

      - name: Release Summary
        run: |
          echo "=================================================="
          echo "Release Completed"
          echo "=================================================="
          echo "Artifacts uploaded to GitHub Release"
          echo "Package published to PyPI"
