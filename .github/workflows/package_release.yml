name: CoopRecSys Package Publisher

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "GitHub Release tag to publish to PyPI, e.g. v0.0.2"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-publish-${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GitHub Release artifacts to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip twine auditwheel

      - name: Download artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.whl" --dir dist

      - name: Repair Linux wheels
        run: |
          # Auditwheel hanya bekerja pada manylinux, jika ini gagal, Build Workflow wajib diubah ke cibuildwheel
          for whl in dist/*linux_x86_64.whl; do
            if [ -f "$whl" ]; then
              auditwheel repair "$whl" --plat manylinux_2_28_x86_64 -w dist/
              rm "$whl"
            fi
          done

      - name: Validate and Publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m twine check dist/*
          python -m twine upload --skip-existing dist/*
