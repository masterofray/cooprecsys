name: CoopRecSys Package Publisher

on:
  release:
    types:
      - published

  workflow_dispatch:
    inputs:
      tag:
        description: "GitHub Release tag to publish to PyPI, e.g. v0.0.3"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-publish-${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GitHub Release artifacts to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Release Tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail

          TAG="${RELEASE_TAG}"

          if [[ -z "$TAG" ]]; then
            echo "::error::Release tag is empty."
            exit 1
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "::error::Invalid release tag: $TAG"
            echo "::error::Expected format: vX.Y.Z"
            exit 1
          fi

          echo "Publishing release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PyPI tools
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install --upgrade twine packaging

      - name: Download GitHub Release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          echo "Downloading artifacts for release: $TAG"

          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.whl" \
            --pattern "*.tar.gz" \
            --dir dist

      - name: Inspect release artifacts
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "RELEASE ARTIFACTS"
          echo "=========================================="

          ls -lah dist/

          WHEEL_COUNT=$(find dist -maxdepth 1 -type f -name "*.whl" | wc -l)
          SDIST_COUNT=$(find dist -maxdepth 1 -type f -name "*.tar.gz" | wc -l)

          echo
          echo "Wheel count : $WHEEL_COUNT"
          echo "Sdist count : $SDIST_COUNT"

          if [ "$WHEEL_COUNT" -eq 0 ]; then
            echo "::error::No wheel artifacts found in GitHub Release."
            exit 1
          fi

          if [ "$SDIST_COUNT" -eq 0 ]; then
            echo "::error::No source distribution (.tar.gz) found in GitHub Release."
            exit 1
          fi

      - name: Inspect package versions
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          from packaging.utils import parse_wheel_filename, parse_sdist_filename

          packages = set()
          versions = set()

          print("=" * 70)
          print("DISTRIBUTION METADATA")
          print("=" * 70)

          for path in sorted(Path("dist").iterdir()):
              if path.suffix == ".whl":
                  name, version, build, tags = parse_wheel_filename(path.name)
                  print(path.name)
                  print(f"  package : {name}")
                  print(f"  version : {version}")
                  print(f"  tags    : {len(tags)}")
                  packages.add(str(name))
                  versions.add(str(version))

              elif path.name.endswith(".tar.gz"):
                  name, version = parse_sdist_filename(path.name)
                  print(path.name)
                  print(f"  package : {name}")
                  print(f"  version : {version}")
                  packages.add(str(name))
                  versions.add(str(version))

          if packages != {"cooprecsys"}:
              raise SystemExit(
                  f"Unexpected package set: {sorted(packages)}; expected ['cooprecsys']"
              )

          if len(versions) != 1:
              raise SystemExit(
                  f"Multiple distribution versions found: {sorted(versions)}"
              )

          print("=" * 70)
          print("Package : cooprecsys")
          print(f"Version : {next(iter(versions))}")
          print("=" * 70)
          PY

      - name: Verify release tag and artifact version
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          TAG_VERSION="${TAG#v}"

          ARTIFACT_VERSION="$(python -c '
          from pathlib import Path
          from packaging.utils import parse_wheel_filename, parse_sdist_filename

          version = None
          for path in sorted(Path("dist").iterdir()):
              if path.suffix == ".whl":
                  _, version, _, _ = parse_wheel_filename(path.name)
                  break
              if path.name.endswith(".tar.gz"):
                  _, version = parse_sdist_filename(path.name)
                  break

          if version is None:
              raise SystemExit("Could not determine artifact version")

          print(version)
          ')"

          if [[ "$TAG_VERSION" != "$ARTIFACT_VERSION" ]]; then
            echo "::error::Release tag version ($TAG_VERSION) does not match artifact version ($ARTIFACT_VERSION)."
            exit 1
          fi

          echo "Version consistency check PASSED: $TAG_VERSION"

      - name: Verify Linux wheel tags
        shell: bash
        run: |
          set -euo pipefail

          found_linux=0

          for whl in dist/*manylinux*.whl; do
            [ -f "$whl" ] || continue

            found_linux=1
            name="$(basename "$whl")"

            echo "Checking Linux wheel: $name"

            case "$name" in
              *manylinux_2_28_x86_64.whl)
                echo "  OK: contains manylinux_2_28_x86_64"
                ;;
              *)
                echo "::error::Linux wheel does not contain manylinux_2_28_x86_64:"
                echo "::error::$name"
                exit 1
                ;;
            esac
          done

          if [ "$found_linux" -eq 0 ]; then
            echo "::error::No manylinux Linux wheel found."
            exit 1
          fi

      - name: Validate package with Twine
        run: |
          set -euo pipefail
          python -m twine check dist/*

      - name: Generate artifact hashes
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SHA256"
          echo "=========================================="

          sha256sum dist/*

      - name: Publish distributions to PyPI
        env:
          TWINE_USERNAME: "__token__"
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "PYPI UPLOAD"
          echo "=========================================="

          mapfile -t ARTIFACTS < <(
            find dist -maxdepth 1 -type f \
              \( -name "*.tar.gz" -o -name "*.whl" \) \
              -print | sort
          )

          if [ "${#ARTIFACTS[@]}" -eq 0 ]; then
            echo "::error::No distributions found."
            exit 1
          fi

          for artifact in "${ARTIFACTS[@]}"; do
            echo
            echo "--------------------------------------------------"
            echo "Uploading: $(basename "$artifact")"
            echo "--------------------------------------------------"

            python -m twine upload \
              --verbose \
              --disable-progress-bar \
              --non-interactive \
              --skip-existing \
              "$artifact"

            echo "Upload command completed for: $(basename "$artifact")"
          done

      - name: Release Summary
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          echo "=================================================="
          echo "CoopRecSys PyPI Release Completed"
          echo "=================================================="
          echo "GitHub Release : $TAG"
          echo "Package        : cooprecsys"
          echo "Python         : 3.10 - 3.13"
          echo "Linux ABI      : manylinux_2_28_x86_64"
          echo "Artifacts      : $(find dist -maxdepth 1 -type f | wc -l)"
          echo "Repository     : $GITHUB_REPOSITORY"
          echo "=================================================="
