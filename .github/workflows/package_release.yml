name: CoopRecSys Package Publisher

on:
  release:
    types:
      - published

  workflow_dispatch:
    inputs:
      tag:
        description: "GitHub Release tag to publish to PyPI, e.g. v0.0.3"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-publish-${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GitHub Release artifacts to PyPI
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. Resolve release tag
      # ------------------------------------------------------------
      - name: Resolve Release Tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail

          TAG="${RELEASE_TAG}"

          if [[ -z "$TAG" ]]; then
            echo "::error::Release tag is empty."
            exit 1
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "::error::Invalid release tag: $TAG"
            echo "::error::Expected format: vX.Y.Z"
            exit 1
          fi

          echo "Publishing release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 3. Set up Python
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ------------------------------------------------------------
      # 4. Install Twine
      # ------------------------------------------------------------
      - name: Install Twine
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade twine

      # ------------------------------------------------------------
      # 5. Download artifacts from GitHub Release
      # ------------------------------------------------------------
      - name: Download GitHub Release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          echo "Downloading artifacts for release: $TAG"

          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.whl" \
            --pattern "*.tar.gz" \
            --dir dist

      # ------------------------------------------------------------
      # 6. Inspect artifacts
      # ------------------------------------------------------------
      - name: Inspect release artifacts
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "PYPI RELEASE ARTIFACTS"
          echo "=========================================="

          ls -lah dist/

          WHEEL_COUNT=$(find dist -maxdepth 1 -type f -name "*.whl" | wc -l)
          SDIST_COUNT=$(find dist -maxdepth 1 -type f -name "*.tar.gz" | wc -l)

          echo "Wheel count : $WHEEL_COUNT"
          echo "Sdist count : $SDIST_COUNT"

          if [ "$WHEEL_COUNT" -eq 0 ]; then
            echo "::error::No wheel artifacts found in GitHub Release."
            exit 1
          fi

          if [ "$SDIST_COUNT" -eq 0 ]; then
            echo "::error::No source distribution (.tar.gz) found."
            exit 1
          fi

          echo
          echo "Wheel filenames:"
          find dist -maxdepth 1 -type f -name "*.whl" -printf '%f\n' | sort

      # ------------------------------------------------------------
      # 7. Check that Linux wheels already carry manylinux tag
      # ------------------------------------------------------------
      - name: Verify Linux wheel tags
        shell: bash
        run: |
          set -euo pipefail

          found_linux=0

          for whl in dist/*manylinux*.whl; do
            if [ -f "$whl" ]; then
              found_linux=1
              name="$(basename "$whl")"
              echo "Checking: $name"

              case "$name" in
                *manylinux_2_28_x86_64.whl)
                  echo "  OK: manylinux_2_28_x86_64"
                  ;;
                *)
                  echo "::error::Unexpected manylinux tag in $name"
                  exit 1
                  ;;
              esac
            fi
          done

          if [ "$found_linux" -eq 0 ]; then
            echo "::error::No manylinux Linux wheel found."
            exit 1
          fi

      # ------------------------------------------------------------
      # 8. Validate package metadata
      # ------------------------------------------------------------
      - name: Validate package with Twine
        run: |
          set -euo pipefail
          python -m twine check dist/*

      # ------------------------------------------------------------
      # 9. Publish to PyPI
      # ------------------------------------------------------------
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: "__token__"
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          set -euo pipefail

          python -m twine upload \
            --skip-existing \
            dist/*

      # ------------------------------------------------------------
      # 10. Release summary
      # ------------------------------------------------------------
      - name: Release Summary
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          echo "=================================================="
          echo "CoopRecSys PyPI Release Completed"
          echo "=================================================="
          echo "GitHub Release : $TAG"
          echo "Package        : cooprecsys"
          echo "Python         : 3.10 - 3.13"
          echo "Linux ABI      : manylinux_2_28_x86_64"
          echo "Repository     : $GITHUB_REPOSITORY"
          echo "=================================================="
