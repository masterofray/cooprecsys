name: CoopRecSys Package Publisher

on:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  build-and-publish:
    if: startsWith(github.event.head_commit.message, 'release:')
    name: JackRay Build and Publish
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10 & UV
        run: |
          echo "=================================================="
          echo "[STEP 1/8] Setup Python and UV Toolchain"
          echo "=================================================="
          # Daftarkan Python 3.10 bawaan manylinux ke GITHUB_PATH
          echo "/opt/python/cp310-cp310/bin" >> $GITHUB_PATH
          
          # Install uv secara standalone ke dalam container
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify Environment
        run: |
          echo "=================================================="
          echo "[STEP 2/8] Verify Environment"
          echo "=================================================="
          python --version
          uv --version
          gcc --version

      - name: Build AryColBring Cython Extensions
        working-directory: ./src/models/arycolbring
        run: |
          echo "=================================================="
          echo "[STEP 3/8] Build Cython Extensions"
          echo "=================================================="
          uv pip install --system \
            numpy \
            cython \
            setuptools \
            wheel
          chmod +x ./cysetup.sh
          bash ./cysetup.sh

      - name: Install Project Dependencies
        run: |
          echo "=================================================="
          echo "[STEP 4/8] Install Dependencies"
          echo "=================================================="
          uv pip install --system -e ".[dev,test]"

      - name: Build Raw Package
        run: |
          echo "=================================================="
          echo "[STEP 5/8] Build Raw Package via UV"
          echo "=================================================="
          uv build

      - name: Repair Wheel (Auditwheel to Manylinux)
        run: |
          echo "=================================================="
          echo "[STEP 6/8] Repair Wheel via Auditwheel"
          echo "=================================================="
          mkdir -p final_dist
          
          # Mengubah tag dari linux_x86_64 menjadi manylinux_2_28_x86_64
          auditwheel repair dist/*.whl --wheel-dir final_dist/
          
          # Salin source distribution (.tar.gz) jika ada ke folder final
          cp dist/*.tar.gz final_dist/ || true

      - name: Validate Package
        run: |
          echo "=================================================="
          echo "[STEP 7/8] Validate Package"
          echo "=================================================="
          uv pip install --system twine
          twine check final_dist/*

          echo ""
          echo "Generated & Repaired Files:"
          ls -lah final_dist/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cooprecsys-distribution
          path: |
            final_dist/*.whl
            final_dist/*.tar.gz
          retention-days: 14

      - name: Publish To PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          echo "=================================================="
          echo "[STEP 8/8] Publish To PyPI"
          echo "=================================================="
          twine upload \
            --skip-existing \
            final_dist/*

      - name: Release Summary
        run: |
          echo "=================================================="
          echo "Release Completed"
          echo "=================================================="
          echo "Artifacts successfully compliant with Manylinux standard."
          echo "Package published to PyPI."