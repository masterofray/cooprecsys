# ==========================================================
# Workflow for Ary2tower models
# Author: Aryanto
# ==========================================================

name: Ary2Towers Pipeline

on:
  push:
    branches:
      - dev
      - staging
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  test-ary2tower:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Debug Repository Structure
        run: |
          echo "===== ROOT DIRECTORY ====="
          ls -lAh --group-directories-first
          echo ""
          echo "===== TEST DIRECTORY ====="
          ls -lAh --group-directories-first test/ || echo "Test Dir is not found."
          echo ""
          echo "===== PYTHON PATH ====="
          python -c "import sys; print(sys.path)"

      - name: Build ary2tower Cython extension
        working-directory: src/cooprecsys/models/ary2tower
        run: python a2tcysetup.py build_ext --inplace

      - name: Train smoke test
        run: python test/ary2tower_tests/ary2tower_train_smoketest.py

      - name: Inference smoke test
        run: python test/ary2tower_tests/ary2tower_inference_smoketest.py

      - name: Direct ary2tower pytest suite
        continue-on-error: true
        run: pytest test/ary2tower_tests/t03_pytest.py -v --tb=short
