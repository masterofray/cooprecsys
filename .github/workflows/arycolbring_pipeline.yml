name: AryColBring Smoke Test Pipeline

on:
  push:
    branches:
      - 'dev'
      - 'master'

  pull_request:
    branches:
      - 'dev'
      - 'master'

  workflow_dispatch:
    inputs:
      run_smoke:
        description: 'Jalankan Smoke Test secara manual'
        required: false
        type: boolean
        default: true

jobs:
  # JOB 1: Sukses Terisolasi untuk Keamanan Kode
  security-scan:
    name: Run Bandit Security Analysis
    runs-on: ubuntu-latest
    if: |
      contains(github.event.head_commit.message, 'Run Smoke AryColbring') || 
      (github.event_name == 'workflow_dispatch' && inputs.run_smoke == true)
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up uv Package Manager
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run Bandit Security Analysis
        run: |
          echo "=========================================================================="
          echo "Executing Bandit for high security only"
          echo "=========================================================================="
          # uvx memisahkan eksekusi dari dependensi pyproject.toml yang sedang konflik
          uvx bandit \
            -r ./src/cooprecsys \
            -lll \
            --confidence-level high \
            -s B101,B311,B608

  # JOB 1.5: Linting & Formatting (black / flake8 / isort)
  lint:
    name: Lint (black / flake8 / isort)
    runs-on: ubuntu-latest
    if: |
      contains(github.event.head_commit.message, 'Run Smoke AryColbring') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_smoke == true)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv Package Manager
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install Dev Dependencies
        run: uv pip install --system ".[dev]"

      - name: Run Black (check only)
        run: black --check src/models/arycolbring src/assets test/arycolbring_tests

      - name: Run Flake8
        run: flake8 src/models/arycolbring src/assets test/arycolbring_tests

      - name: Run isort (check only)
        run: isort --check-only src/models/arycolbring src/assets test/arycolbring_tests

  # JOB 1.75: Unit + Integration Tests (pytest, with coverage)
  pytest-suite:
    name: Pytest Suite (unit + integration, coverage)
    runs-on: ubuntu-latest
    if: |
      contains(github.event.head_commit.message, 'Run Smoke AryColbring') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_smoke == true)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv Package Manager
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install System Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install Dependencies with uv
        run: uv pip install --system ".[dev]"

      - name: Compile Cython Extensions
        run: |
          cd ./src/cooprecsys/models/arycolbring
          bash cysetup.sh

      - name: Verify Package Imports
        run: |
          export PYTHONPATH="${{ github.workspace }}"
          python -c "from src.cooprecsys.models.arycolbring import inference; print('import OK')"

      - name: Run Pytest Suite (t03_pytest.py + t05_dashboard_refactor.py)
        run: |
          export PYTHONPATH="${{ github.workspace }}"
          # NOTE ON COVERAGE THRESHOLDS: this repo does not yet have a
          # measured coverage baseline for arycolbring (the previous
          # config pointed --cov at a module name, "cooprecsys", that
          # isn't actually importable anywhere in this repo -- see the
          # pyproject.toml fix alongside this workflow -- so no
          # coverage number it ever reported was real). Don't add
          # --cov-fail-under=90 / =80 here until a first real run has
          # established what the actual current percentage is; picking
          # a round number now would just be a second fabricated
          # threshold on top of the first one.
          pytest test/arycolbring_tests/t03_pytest.py \
                 test/arycolbring_tests/t05_dashboard_refactor.py \
                 -v --tb=short \
                 --cov=src/cooprecsys/models/arycolbring --cov=src/assets \
                 --cov-report=xml --cov-report=term-missing

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: arycolbring-coverage
          path: coverage.xml

  # JOB 2: Uji Coba Multi-Versi Python (3.10 - 3.13)
  smoke-test:
    name: Smoke Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    if: |
      contains(github.event.head_commit.message, 'Run Smoke AryColbring') || 
      (github.event_name == 'workflow_dispatch' && inputs.run_smoke == true)
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv Package Manager
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install System Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install Dependencies with uv
        run: |
          echo "=========================================================================="
          echo "Installing environment dependencies via uv."
          echo "=========================================================================="
          uv pip install --system ".[dev]"

      - name: Compile Cython Extensions
        run: |
          echo "=========================================================================="
          echo "Compiling Cython extension modules."
          echo "=========================================================================="
          cd ./src/cooprecsys/models/arycolbring
          bash cysetup.sh

      - name: Execute Automated Smoke Test
        run: |
          echo "=========================================================================="
          echo "Launching AryColBring Model Training Smoke Test."
          echo "=========================================================================="
          export PYTHONPATH="${{ github.workspace }}"
          python test/arycolbring_tests/t01_advisor.py \
            -d ./data/sampledata.parquet \
            -t 0.25 \
            -e 50 \
            -n "Test experiment Python ${{ matrix.python-version }}"
          echo "=========================================================================="
          echo "Smoke test pipeline completed successfully for Python ${{ matrix.python-version }}."
          echo "=========================================================================="

      - name: Execute Inference Smoke Test (t02_reasoner.py)
        run: |
          echo "=========================================================================="
          echo "Launching AryColBring Inference Smoke Test against the model just trained."
          echo "=========================================================================="
          export PYTHONPATH="${{ github.workspace }}"
          # t01_advisor.py saves to <output_dir>/ACBmodel/<YYYYMMDD>_models.npz --
          # the exact filename is timestamp-based, so grab the most recently
          # written one rather than hardcoding today's date.
          MODEL_PATH=$(find ./artifacts/ACBmodel -name '*_models.npz' -printf '%T@ %p\n' \
                       | sort -n | tail -1 | cut -d' ' -f2-)
          if [ -z "$MODEL_PATH" ]; then
            echo "No trained model found under ./artifacts/ACBmodel -- t01 smoke test may have used a different output-dir."
            exit 1
          fi
          echo "Using model: $MODEL_PATH"
          python -m test.arycolbring_tests.t02_reasoner \
            -m "$MODEL_PATH" \
            -u 20 \
            -r 10
          echo "=========================================================================="
          echo "Inference smoke test (incl. dashboard report generation) completed for Python ${{ matrix.python-version }}."
          echo "=========================================================================="
