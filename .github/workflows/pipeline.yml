# ==========================================================
# GitHub Actions Workflow for CoopRecSys
# Author: Aryanto
# File Location: .github/workflows/pipeline.yml
# ==========================================================

name: CoopRecSys CI CD Pipeline

on:
  push:
    branches:
      - dev
      - master

  pull_request:
    branches:
      - dev
      - master

  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"

jobs:

  # ==========================================================
  # LTR LIGHTGBM SMOKE TEST
  # ==========================================================
  smoke-ltr:

    name: LTR LightGBM Smoke Test
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Setup Python
      # ------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ------------------------------------------------------
      # Upgrade pip + install dependencies
      # ------------------------------------------------------
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --quiet -r requirements.txt

      # ------------------------------------------------------
      # Debug repository structure
      # ------------------------------------------------------
      - name: Debug Repository Structure
        run: |
          echo "===== ROOT DIRECTORY ====="
          ls -la

          echo ""
          echo "===== TEST DIRECTORY ====="
          ls -la test/ || echo "Folder test tidak ditemukan"

          echo ""
          echo "===== PYTHON PATH ====="
          python -c "import sys; print(sys.path)"

      # ------------------------------------------------------
      # Run LTR Smoke Test
      # ------------------------------------------------------
      - name: Run ltrlgbm_test
        env:
          # IMPORTANT:
          # Use local file storage instead of SQLite DB
          # This is MUCH more stable in GitHub Actions
          MLFLOW_TRACKING_URI: "file:./mlruns"

        run: |
          echo "===== STARTING LTR LIGHTGBM TEST ====="

          python -m test.ltrlgbm_test.ltrlgbm_example

          echo "===== TEST FINISHED ====="

      # ------------------------------------------------------
      # Debug generated outputs
      # ------------------------------------------------------
      - name: Debug Generated Files
        if: always()

        run: |
          echo "===== MLFLOW FILES ====="
          find mlruns || true

          echo ""
          echo "===== ARTIFACT FILES ====="
          find artifacts || true

      # ------------------------------------------------------
      # Upload MLflow outputs
      # ------------------------------------------------------
      - name: Upload MLflow Artifacts
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: mlflow-runs
          path: mlruns/
          retention-days: 7
          if-no-files-found: warn

      # ------------------------------------------------------
      # Upload HTML reports
      # ------------------------------------------------------
      - name: Upload HTML Report
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: ltr-evaluation-report
          path: artifacts/reports/*.html
          retention-days: 7
          if-no-files-found: warn

  merge-artifacts:
    name: Merge Artifacts
    runs-on: ubuntu-latest
    needs: smoke-ltr
    steps:
      - name: Merge All Artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: all-artifacts
          pattern: *


  # ==========================================================
  # LTR INFERENCE FALLBACK TEST
  # ==========================================================
  ltr-inference-fallback:
    name: LTR Inference Fallback Test
    runs-on: ubuntu-latest
    needs: merge-artifacts

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --quiet -r requirements.txt

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Debug Artifacts Content
        run: |
          echo "===== Check contents of artifacts/ ====="
          ls -la artifacts/ || echo "Folder artifacts tidak ditemukan"
          find artifacts -type f

      - name: Set MLflow Tracking URI (if needed)
        run: |
          echo "MLFLOW_TRACKING_URI=file:./mlruns" >> $GITHUB_ENV

      - name: Run Inference Fallback Test
        run: |
          echo "===== STARTING INFERENCE FALLBACK TEST ====="
          python -m test.ltrlgbm_test.inference_fallback_test
          echo "===== INFERENCE FALLBACK TEST FINISHED ====="

      - name: Upload Ranking Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fallback-rankings
          path: artifacts/*.parquet
          retention-days: 7
          if-no-files-found: warn


  # ==========================================================
  # SECURITY SCAN
  # ==========================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit Security Scan
        run: |
          set +e
          echo "===== RUNNING BANDIT SECURITY SCAN ====="
          bandit -r src --severity-level high -f txt --skip B605,B607
          EXIT_CODE=$?
          set -e
          echo ""
          echo "Bandit Exit Code: $EXIT_CODE"
          if [ $EXIT_CODE -eq 0 ]; then
            echo "No high severity issues found"
          elif [ $EXIT_CODE -eq 1 ]; then
            echo "High severity issues found"
            exit 1
          else
            echo "Bandit exited with unexpected code: $EXIT_CODE"
            exit 0
          fi