# GitHub Actions Workflow for CoopRecSys
# Author: Aryanto
# File Location: .github/workflows/pipeline.yml
# ==========================================================

name: CoopRecSys CI CD Pipeline

on:
  push:
    branches:
      - dev
      - master
  pull_request:
    branches:
      - dev
      - master
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"

jobs:

  quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install QA Tools
        run: |
          python -m pip install --upgrade pip
          pip install black ruff isort

      - name: Run Ruff Linter
        run: |
          ruff check src test

      - name: Run Black Format Check
        run: |
          black . --check

      - name: Run isort Check
        run: |
          isort . --check-only

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Pytest
        run: |
          pytest test -v \
            --cov=src \
            --cov-report=term \
            --cov-report=xml

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  smoke-ltr:
    name: LTR LightGBM Smoke Test
    runs-on: ubuntu-latest
    needs: test
  
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
  
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
  
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .   # install project + semua dependency dari setup.py
  
      - name: Debug directory
        run: |
          ls -la
          ls -la test/ || echo "Folder test tidak ditemukan"
          python -c "import sys; print(sys.path)"
  
      - name: Run ltrlgbm_test
        run: |
          python -m test.ltrlgbm_test
  
      - name: Upload HTML Report (if exists)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ltr-evaluation-report
          path: artifacts/reports/*.html
          retention-days: 7
          if-no-files-found: warn

  package:
    name: Build Python Package
    runs-on: ubuntu-latest
    needs: smoke-ltr

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build Distribution
        run: |
          python -m build

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-dist
          path: dist/

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit Security Scan
        run: |
          bandit -r src -ll