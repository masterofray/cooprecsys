name: CoopRecSys CI CD Pipeline

on:
  push:
    branches:
      - dev
      - master
  pull_request:
    branches:
      - dev
      - master
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"

jobs:

  smoke-ltr:
    name: LTR LightGBM Smoke Test
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
  
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
  
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --quiet -r requirements.txt
          # pip install -e .   # DIHAPUS karena belum diperlukan
  
      - name: Debug directory
        run: |
          ls -la
          ls -la test/ || echo "Folder test tidak ditemukan"
          python -c "import sys; print(sys.path)"
  
      - name: Run ltrlgbm_test
        run: |
          # Sesuaikan path ini dengan struktur folder sebenarnya
          python -m test.ltrlgbm_test.ltrlgbm_example
  
      - name: Upload HTML Report (if exists)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ltr-evaluation-report
          path: artifacts/reports/*.html
          retention-days: 7
          if-no-files-found: warn

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit Security Scan
        run: |
          # Jalankan scan, tapi tangkap exit code
          set +e
          bandit -r src -ll -f custom --severity-level high
          EXIT_CODE=$?
          set -e
          
          if [ $EXIT_CODE -eq 0 ]; then
            echo "No High severity issues found"
          elif [ $EXIT_CODE -eq 1 ]; then
            echo "High severity issues found - Failing pipeline"
            exit 1
          else
            echo "Bandit exited with code $EXIT_CODE"
            exit 0
          fi