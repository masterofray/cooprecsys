# ==========================================================
# GitHub Actions Workflow for CoopRecSys
# Author: Aryanto
# File Location: .github/workflows/pipeline.yml
# ==========================================================

name: CoopRecSys CI CD Pipeline

on:
  push:
    branches:
      - dev
      - master

  pull_request:
    branches:
      - dev
      - master

  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"

jobs:

  # ==========================================================
  # LTR LIGHTGBM SMOKE TEST
  # ==========================================================
  smoke-ltr:

    name: LTR LightGBM Smoke Test
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Setup Python
      # ------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ------------------------------------------------------
      # Upgrade pip + install dependencies
      # ------------------------------------------------------
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --quiet -r requirements.txt

      # ------------------------------------------------------
      # Debug repository structure
      # ------------------------------------------------------
      - name: Debug Repository Structure
        run: |
          echo "===== ROOT DIRECTORY ====="
          ls -la

          echo ""
          echo "===== TEST DIRECTORY ====="
          ls -la test/ || echo "Folder test tidak ditemukan"

          echo ""
          echo "===== PYTHON PATH ====="
          python -c "import sys; print(sys.path)"

      # ------------------------------------------------------
      # Run LTR Smoke Test
      # ------------------------------------------------------
      - name: Run ltrlgbm_test
        env:
          # IMPORTANT:
          # Use local file storage instead of SQLite DB
          # This is MUCH more stable in GitHub Actions
          MLFLOW_TRACKING_URI: "file:./mlruns"

        run: |
          echo "===== STARTING LTR LIGHTGBM TEST ====="

          python -m test.ltrlgbm_test.ltrlgbm_example

          echo "===== TEST FINISHED ====="

      # ------------------------------------------------------
      # Upload Full Artifacts Directory
      # ------------------------------------------------------
      - name: Upload Full Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-artifacts
          path: |
            artifacts/
            mlruns/
          retention-days: 7
          if-no-files-found: warn

      # ------------------------------------------------------
      # Install tree utility
      # ------------------------------------------------------
      - name: Install tree
        run: |
          sudo apt-get update
          sudo apt-get install -y tree
      
      # ------------------------------------------------------
      # Debug artifact folder
      # ------------------------------------------------------
      - name: Debug Artifact Folder
        run: |
          echo "===== ARTIFACT TREE ====="
      
          if [ -d "artifacts" ]; then
            tree artifacts
          else
            echo "artifacts folder NOT FOUND"
          fi
      

  # ==========================================================
  # COPYING THE FILES
  # ==========================================================
  merge-artifacts:
    name: Merge Artifacts
    runs-on: ubuntu-latest
    needs: smoke-ltr

    steps:
  
      # ------------------------------------------------------
      # Install tree utility
      # ------------------------------------------------------
      - name: Install tree
        run: |
          sudo apt-get update
          sudo apt-get install -y tree
  
      # ------------------------------------------------------
      # Merge uploaded artifacts
      # ------------------------------------------------------
      - name: Merge All Artifacts
        uses: actions/upload-artifact/merge@v4
  
        with:
          name: all-artifacts
          pattern: full-artifacts
          separate-directories: false
  
      # ------------------------------------------------------
      # Download merged artifacts for verification
      # ------------------------------------------------------
      - name: Download Merged Artifact
        uses: actions/download-artifact@v4
  
        with:
          name: all-artifacts
          path: merged-debug/
  
      # ------------------------------------------------------
      # Debug merged contents
      # ------------------------------------------------------
      - name: Debug Merged Artifact Tree
        run: |
          echo "===== MERGED TREE ====="
          tree merged-debug
  
          echo ""
          echo "===== SEARCH ENCODER ====="
          find merged-debug -iname "*encoder*"
  
          echo ""
          echo "===== SEARCH MODEL ====="
          find merged-debug -iname "*model*"
  
          echo ""
          echo "===== SEARCH CLOUDPICKLE ====="
          find merged-debug -name "*.cloudpickle"
  
          echo ""
          echo "===== SEARCH PARQUET ====="
          find merged-debug -name "*.parquet"


  # ==========================================================
  # LTR INFERENCE FALLBACK TEST
  # ==========================================================
  ltr-inference-fallback:
    name: LTR Inference Fallback Test
    runs-on: ubuntu-latest
    needs: merge-artifacts

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --quiet -r requirements.txt

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          name: all-artifacts
          path: .
          merge-multiple: true


      # ------------------------------------------------------
      # Install tree utility
      # ------------------------------------------------------
      - name: Install tree
        run: |
          sudo apt-get update
          sudo apt-get install -y tree
      
      # ------------------------------------------------------
      # Debug downloaded artifacts
      # ------------------------------------------------------
      - name: Debug Downloaded Artifacts
        run: |
          echo "===== CURRENT DIRECTORY ====="
          pwd
      
          echo ""
          echo "===== ROOT TREE ====="
          tree -L 5
      
          echo ""
          echo "===== ARTIFACT TREE ====="
      
          if [ -d "artifacts" ]; then
            tree artifacts
          else
            echo "artifacts folder NOT FOUND"
          fi
      
          echo ""
          echo "===== SEARCH FOR PKL FILES ====="
          find . -name "*.pkl"
      
          echo ""
          echo "===== SEARCH FOR MODEL FILES ====="
          find . -iname "*model*"
      
          echo ""
          echo "===== SEARCH FOR ENCODER FILES ====="
          find . -iname "*encoder*"
      
          echo ""
          echo "===== SEARCH FOR ALL PARQUET ====="
          find . -name "*.parquet"

      - name: Set MLflow Tracking URI (if needed)
        run: |
          echo "MLFLOW_TRACKING_URI=file:./mlruns" >> $GITHUB_ENV

      - name: Run Inference Fallback Test
        run: |
          echo "===== STARTING INFERENCE FALLBACK TEST ====="
          python -m test.ltrlgbm_test.ltrlgbm_inferencing
          echo "===== INFERENCE FALLBACK TEST FINISHED ====="

      - name: Upload Ranking Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fallback-rankings
          path: artifacts/*.parquet
          retention-days: 7
          if-no-files-found: warn


  # ==========================================================
  # SECURITY SCAN
  # ==========================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit Security Scan
        run: |
          set +e
          echo "===== RUNNING BANDIT SECURITY SCAN ====="
          bandit -r src --severity-level high -f txt --skip B605,B607
          EXIT_CODE=$?
          set -e
          echo ""
          echo "Bandit Exit Code: $EXIT_CODE"
          if [ $EXIT_CODE -eq 0 ]; then
            echo "No high severity issues found"
          elif [ $EXIT_CODE -eq 1 ]; then
            echo "High severity issues found"
            exit 1
          else
            echo "Bandit exited with unexpected code: $EXIT_CODE"
            exit 0
          fi


  # =========================================================
  # CYTHON BUILD VALIDATION
  # =========================================================
  Cython-Build-Validation:
    name: Cython Build test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cython numpy pandas setuptools wheel
      
      - name: Verify GCC/OpenMP
        run: |
          gcc --version
          g++ --version

      #- name: Debug Paths
      #  run: |
      #    echo "PWD:"
      #    pwd
      #    echo ""
      #    echo "ROOT FILES:"
      #    ls -la
      #    echo ""
      #    echo "DIRECTORIES:"
      #    find . -maxdepth 3 -type d

      - name: Build AryColBring Cython Extensions
        run: |
          chmod +x ./run_colbring.sh
          bash ./run_colbring.sh
      
      - name: Verify Compiled Shared Objects
        working-directory: ./src
        run: |
          echo "Checking compiled modules..."
          find . -name "*.so" -o -name "*.pyd"
          test $(find . -name "*.so" -o -name "*.pyd" | wc -l) -gt 0
      
      - name: Import Test
        working-directory: ./src
        run: |
          python -c "
          import sys
          print(sys.path)
          import models.arycolbring.CLproximity._cy_math
          import models.arycolbring.CLproximity._cy_update
          import models.arycolbring.CLproximity._cy_predict
          print('SUCCESS: Cython modules imported')
          "
