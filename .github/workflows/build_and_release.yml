name: Build & Release Wheel

on:
  push:
    branches:
      - master
      - dev
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - master
      - dev
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.0.2 (blank = build-only run)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  PIP_NO_INPUT: "1"
  CYTHON_COVERAGE: "0"

jobs:
  # ---------------------------------------------------------------------
  # Decides IF this run should produce a release, and creates+pushes the
  # git tag if so. Triggered by either:
  #   - workflow_dispatch with a "version" input, OR
  #   - a push to master/dev whose commit message contains "Release and Tag",
  #     optionally with an explicit version: "Release and Tag v1.4.0"
  #   - a manually-pushed tag (refs/tags/v*) — handled as a passthrough
  #
  # NOTE: pushing a tag here using GITHUB_TOKEN will NOT trigger a second
  # workflow run (GitHub blocks recursive runs from GITHUB_TOKEN pushes by
  # design). So instead of relying on that second trigger, every downstream
  # job in THIS run consumes `create-tag` outputs directly via `needs`.
  # ---------------------------------------------------------------------
  create-tag:
    name: "Create Tag (Release and Tag)"
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name || steps.tagpush.outputs.tag_name }}
      is_release: ${{ steps.tag.outputs.is_release || steps.tagpush.outputs.is_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Passthrough — already a tag push
        id: tagpush
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          echo "tag_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "is_release=true" >> "$GITHUB_OUTPUT"

      # This is the explicit trigger gate — same idiom as your "Run Smoke
      # AryColbring" example: a job-level condition using contains() on the
      # commit message, OR'd with the workflow_dispatch path. Supports:
      #   - commit message: "Release and Tag v1.4.0"  → uses 1.4.0 from the message
      #   - commit message: "Release and Tag"          → falls back to pyproject.toml version
      #   - workflow_dispatch with a "version" input
      - name: Create & push annotated tag
        id: tag
        if: |
          !startsWith(github.ref, 'refs/tags/v') &&
          (
            (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '') ||
            (github.event_name == 'push' && contains(github.event.head_commit.message, 'Release and Tag'))
          )
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"

          if [ -z "$VERSION" ]; then
            # Extract version straight out of the commit message, e.g.
            # "Release and Tag v1.4.0" -> 1.4.0. Case-insensitive, "v" optional.
            MSG=$(git log -1 --pretty=%B)
            VERSION=$(echo "$MSG" | grep -oiE "release and tag[[:space:]]+v?[0-9]+\.[0-9]+(\.[0-9]+)?" | grep -oE "[0-9]+\.[0-9]+(\.[0-9]+)?" | head -n1)
          fi

          if [ -z "$VERSION" ]; then
            # No explicit version anywhere in the message -> fall back to pyproject.toml
            VERSION=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"(.*)".*/\1/')
          fi

          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine a version to tag. Use 'Release and Tag vX.Y.Z' in the commit message, the workflow_dispatch 'version' input, or set version in pyproject.toml."
            exit 1
          fi

          TAG="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::warning::Tag $TAG already exists locally/remotely — reusing it, no new tag pushed."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "is_release=true" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # sdist only needs to be built once — it's pure source, not compiled,
  # and identical regardless of OS/Python version.
  # ---------------------------------------------------------------------
  build-sdist:
    name: Build sdist (tar.gz)
    runs-on: ubuntu-latest
    needs: [create-tag]
    if: always() && needs.create-tag.result == 'success'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-tag.outputs.tag_name || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Build sdist via uv
        run: uv build --sdist --out-dir dist/

      - name: List sdist
        run: ls -lh dist/

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------
  # Wheels — Ubuntu (required baseline for every release)
  # ---------------------------------------------------------------------
  build-wheels-ubuntu:
    name: Build wheel (ubuntu-latest / py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [create-tag]
    if: always() && needs.create-tag.result == 'success'
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-tag.outputs.tag_name || github.ref }}
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Create uv cache directory
        run: mkdir -p "${{ env.UV_CACHE_DIR }}"

      - name: Install build dependencies via uv
        run: |
          uv pip install --system \
            "setuptools>=70.0" \
            "wheel>=0.42" \
            "cython>=3.0" \
            "numpy>=1.21" \
            build

      - name: Verify GCC/OpenMP
        run: |
          gcc --version
          g++ --version

      - name: Build AryColBring Cython Extensions
        working-directory: ./src/models/arycolbring
        run: |
          chmod +x ./cysetup.sh
          bash ./cysetup.sh

      - name: Build wheel via uv
        run: uv build --wheel --out-dir dist/

      - name: List generated artifacts & inspect wheel
        run: |
          ls -lh dist/
          echo "========================================="
          echo "INSPECTING WHEEL CONTENTS:"
          echo "========================================="
          for f in dist/*.whl; do
            echo "--- $f ---"
            python -m zipfile -l "$f"
          done

      - name: Upload wheel as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-ubuntu-latest-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------
  # Wheels — Windows (best-effort bonus; a Windows failure never blocks
  # the Ubuntu release)
  # ---------------------------------------------------------------------
  build-wheels-windows:
    name: Build wheel (windows-latest / py${{ matrix.python-version }})
    runs-on: windows-latest
    needs: [create-tag]
    if: always() && needs.create-tag.result == 'success'
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-tag.outputs.tag_name || github.ref }}
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Create uv cache directory
        shell: bash
        run: mkdir -p "${{ env.UV_CACHE_DIR }}"

      - name: Install build dependencies via uv
        shell: bash
        run: |
          uv pip install --system \
            "setuptools>=70.0" \
            "wheel>=0.42" \
            "cython>=3.0" \
            "numpy>=1.21" \
            build

      - name: Set up MSVC Developer environment
        uses: ilammy/msvc-dev-cmd@v1
        # Ensures cl.exe / link.exe and the correct INCLUDE/LIB paths are on
        # PATH for THIS job's shell. setuptools' vswhere auto-detection covers
        # plain `pip install`-style builds reasonably well, but direct
        # `build_ext` invocations (especially with custom OpenMP flags) are
        # where the auto-detection most often silently picks the wrong
        # toolset or misses Windows SDK paths — this action removes that
        # variable entirely.

      - name: Verify MSVC toolchain
        shell: pwsh
        run: |
          python -c "import setuptools; print('setuptools:', setuptools.__version__)"
          $cl = Get-Command cl.exe -ErrorAction SilentlyContinue
          if ($cl) { Write-Host "cl.exe resolved: $($cl.Source)" } else { Write-Error "cl.exe still not on PATH after msvc-dev-cmd setup." }

      - name: Build AryColBring Cython Extensions
        working-directory: ./src/models/arycolbring
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: ./cysetup.ps1

      - name: Build wheel via uv
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: uv build --wheel --out-dir dist/

      - name: List generated artifacts & inspect wheel
        shell: bash
        run: |
          ls -lh dist/
          echo "========================================="
          echo "INSPECTING WHEEL CONTENTS:"
          echo "========================================="
          for f in dist/*.whl; do
            echo "--- $f ---"
            python -m zipfile -l "$f"
          done

      - name: Upload wheel as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows-latest-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------
  # Test — Ubuntu (required baseline)
  # ---------------------------------------------------------------------
  test-ubuntu:
    name: Test Installed Wheel (ubuntu-latest / py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [create-tag, build-wheels-ubuntu]
    if: always() && needs.build-wheels-ubuntu.result == 'success'
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-tag.outputs.tag_name || github.ref }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Download matching wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-ubuntu-latest-py${{ matrix.python-version }}
          path: dist/

      - name: Resolve wheel filename
        id: wheel_info
        run: |
          WHEEL_FILE=$(ls -1 dist/*.whl | head -n 1)
          if [ -z "$WHEEL_FILE" ]; then
            echo "ERROR: No wheel file found in dist/"
            ls -la dist/
            exit 1
          fi
          echo "wheel_file=$WHEEL_FILE" >> "$GITHUB_OUTPUT"
          echo "Resolved wheel: $WHEEL_FILE"

      - name: Inspect wheel structure and binary (.so) files
        run: |
          # Install tree di runner Ubuntu
          sudo apt-get update -qq && sudo apt-get install -y -qq tree

          echo "=== 1. Summary File Binary (.so) & Config (.ini) ==="
          unzip -l "${{ steps.wheel_info.outputs.wheel_file }}" | grep -E '\.so|\.ini' || echo "WARNING: No .so or .ini files found!"

          echo -e "\n=== 2. Detailed Tree Structure ==="
          mkdir -p /tmp/whl_contents
          unzip -q "${{ steps.wheel_info.outputs.wheel_file }}" -d /tmp/whl_contents

          tree /tmp/whl_contents

          rm -rf /tmp/whl_contents

      - name: Create isolated test environment via uv
        run: uv venv test_env --python ${{ matrix.python-version }}

      - name: Install wheel into isolated environment
        run: |
          source test_env/bin/activate
          uv pip install "${{ steps.wheel_info.outputs.wheel_file }}"
          uv pip show cooprecsys
          python -c "import cooprecsys; print('SUCCESS:', cooprecsys.__file__)"
      - name: Install test dependencies
        run: |
          source test_env/bin/activate
          uv pip install pytest pytest-cov

      # Uncomment once your test suite is validated against the built wheel:
      # - name: Run integration tests against wheel
      #   run: |
      #     source test_env/bin/activate
      #     pytest test/ \
      #       -v \
      #       --tb=short \
      #       --import-mode=importlib \
      #       --cov=cooprecsys \
      #       --cov-report=xml:coverage.xml \
      #       --cov-report=term-missing \
      #       --junit-xml=test-results.xml
      #
      # - name: Upload coverage reports
      #   uses: codecov/codecov-action@v4
      #   if: always()
      #   with:
      #     files: ./coverage.xml
      #     flags: unittests
      #     name: coverage-ubuntu-latest-${{ matrix.python-version }}
      #     fail_ci_if_error: false
      #     token: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------
  # Test — Windows (best-effort bonus; failing here only drops Windows
  # wheels from the release, it never blocks the Ubuntu release)
  # ---------------------------------------------------------------------
  test-windows:
    name: Test Installed Wheel (windows-latest / py${{ matrix.python-version }})
    runs-on: windows-latest
    needs: [create-tag, build-wheels-windows]
    if: always() && needs.build-wheels-windows.result == 'success'
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-tag.outputs.tag_name || github.ref }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Download matching wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-windows-latest-py${{ matrix.python-version }}
          path: dist/

      - name: Resolve wheel filename
        id: wheel_info
        shell: bash
        run: |
          WHEEL_FILE=$(ls -1 dist/*.whl | head -n 1)
          if [ -z "$WHEEL_FILE" ]; then
            echo "ERROR: No wheel file found in dist/"
            ls -la dist/
            exit 1
          fi
          echo "wheel_file=$WHEEL_FILE" >> "$GITHUB_OUTPUT"
          echo "Resolved wheel: $WHEEL_FILE"

      - name: Create isolated test environment via uv
        shell: bash
        run: uv venv test_env --python ${{ matrix.python-version }}

      - name: Install wheel into isolated environment
        shell: bash
        run: |
          source test_env/Scripts/activate

          # `scann` (a runtime dependency of cooprecsys) only ships
          # manylinux wheels — there is no win_amd64 build, so full
          # dependency resolution is unsatisfiable on Windows by design,
          # not a CI misconfiguration. --no-deps installs just the
          # cooprecsys wheel itself, which is enough to verify the
          # compiled Cython/.pyd extensions inside it load correctly.
          echo "::notice::Windows: installing cooprecsys with --no-deps (scann has no win_amd64 wheel)."
          uv pip install --no-deps "${{ steps.wheel_info.outputs.wheel_file }}"
          uv pip show cooprecsys
          python -c "import cooprecsys; print('SUCCESS:', cooprecsys.__file__)"

      - name: Install test dependencies
        shell: bash
        run: |
          source test_env/Scripts/activate
          uv pip install pytest pytest-cov

  # ---------------------------------------------------------------------
  # Publish wheels + sdist to a GitHub Release.
  #
  # Ubuntu is the required baseline: if test-ubuntu succeeds, a release is
  # created with (at least) the Ubuntu wheels + sdist — regardless of what
  # happened on Windows. Windows wheels are added on top ONLY if
  # test-windows also succeeded. If Windows fails, the release still goes
  # out with Ubuntu-only wheels; it's never blocked by a Windows failure.
  # ---------------------------------------------------------------------
  publish:
    name: Publish to Release
    runs-on: ubuntu-latest
    needs: [create-tag, build-sdist, test-ubuntu, test-windows]
    if: |
      always() &&
      needs.create-tag.outputs.is_release == 'true' &&
      needs.build-sdist.result == 'success' &&
      needs.test-ubuntu.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: dist-sdist
          path: dist/

      - name: Download Ubuntu wheels
        uses: actions/download-artifact@v4
        with:
          pattern: dist-ubuntu-latest-py*
          path: dist/
          merge-multiple: true

      - name: Download Windows wheels (only if Windows tests passed)
        if: needs.test-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: dist-windows-latest-py*
          path: dist/
          merge-multiple: true

      - name: Note Windows exclusion
        if: needs.test-windows.result != 'success'
        run: echo "::warning::Windows wheels were NOT included in this release because the Windows test job did not succeed (result=${{ needs.test-windows.result }}). Releasing with Ubuntu wheels + sdist only."

      - name: List final release artifacts
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-tag.outputs.tag_name }}
          files: |
            dist/*.whl
            dist/*.tar.gz
          draft: false
          prerelease: ${{ contains(needs.create-tag.outputs.tag_name, 'rc') || contains(needs.create-tag.outputs.tag_name, 'beta') || contains(needs.create-tag.outputs.tag_name, 'alpha') }}
          generate_release_notes: true

      - name: Release summary
        run: |
          echo "Release published successfully for tag: ${{ needs.create-tag.outputs.tag_name }}"
          echo "Windows wheels included: ${{ needs.test-windows.result == 'success' }}"
          echo "Sdists published: $(ls -1 dist/*.tar.gz | wc -l)"
          echo "Wheels published: $(ls -1 dist/*.whl | wc -l)"
