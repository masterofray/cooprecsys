name: Build & Release Wheel
on:
  push:
    branches:
      - master
      - dev
    tags:
      - "v*.*"
  pull_request:
    branches:
      - master
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  PIP_NO_INPUT: "1"
  CYTHON_COVERAGE: "0"

jobs:
  # ---------------------------------------------------------------------
  # sdist only needs to be built once — it's pure source, not compiled,
  # and identical regardless of OS/Python version.
  # ---------------------------------------------------------------------
  build-sdist:
    name: Build sdist (tar.gz)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Build sdist via uv
        run: uv build --sdist --out-dir dist/

      - name: List sdist
        run: ls -lh dist/

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------
  # Wheels: full OS x Python matrix
  # ---------------------------------------------------------------------
  build-wheels:
    name: Build wheel (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Create uv cache directory
        shell: bash
        run: mkdir -p "${{ env.UV_CACHE_DIR }}"

      - name: Install build dependencies via uv
        shell: bash
        run: |
          uv pip install --system \
            "setuptools>=70.0" \
            "wheel>=0.42" \
            "cython>=3.0" \
            "numpy>=1.21" \
            build

      - name: Verify GCC/OpenMP (Linux)
        if: runner.os == 'Linux'
        run: |
          gcc --version
          g++ --version

      - name: Verify MSVC toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -c "import setuptools; print('setuptools:', setuptools.__version__)"
          Write-Host "MSVC is auto-detected by setuptools via vswhere on windows-latest runners."

      - name: Build AryColBring Cython Extensions (Linux)
        if: runner.os == 'Linux'
        working-directory: ./src/models/arycolbring
        shell: bash
        run: |
          chmod +x ./cysetup.sh
          bash ./cysetup.sh

      - name: Build AryColBring Cython Extensions (Windows)
        if: runner.os == 'Windows'
        working-directory: ./src/models/arycolbring
        shell: pwsh
        run: ./cysetup.ps1

      - name: Build wheel via uv
        shell: bash
        run: uv build --wheel --out-dir dist/

      - name: List generated artifacts & inspect wheel
        shell: bash
        run: |
          ls -lh dist/
          echo "========================================="
          echo "INSPECTING WHEEL CONTENTS:"
          echo "========================================="
          for f in dist/*.whl; do
            echo "--- $f ---"
            python -m zipfile -l "$f"
          done

      - name: Upload wheel as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------
  # Test each wheel on its matching OS + Python version
  # ---------------------------------------------------------------------
  test:
    name: Test Installed Wheel (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: build-wheels
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Download matching wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/

      - name: Resolve wheel filename
        id: wheel_info
        shell: bash
        run: |
          WHEEL_FILE=$(ls -1 dist/*.whl | head -n 1)
          if [ -z "$WHEEL_FILE" ]; then
            echo "ERROR: No wheel file found in dist/"
            ls -la dist/
            exit 1
          fi
          echo "wheel_file=$WHEEL_FILE" >> "$GITHUB_OUTPUT"
          echo "Resolved wheel: $WHEEL_FILE"

      - name: Create isolated test environment via uv
        shell: bash
        run: uv venv test_env --python ${{ matrix.python-version }}

      - name: Install wheel into isolated environment
        shell: bash
        run: |
          source test_env/bin/activate 2>/dev/null || source test_env/Scripts/activate
          uv pip install "${{ steps.wheel_info.outputs.wheel_file }}"
          uv pip show cooprecsys
          python -c "import cooprecsys; print('SUCCESS:', cooprecsys.__file__)"

      - name: Install test dependencies
        shell: bash
        run: |
          source test_env/bin/activate 2>/dev/null || source test_env/Scripts/activate
          uv pip install pytest pytest-cov

      # Uncomment once your test suite is validated against the built wheel:
      # - name: Run integration tests against wheel
      #   shell: bash
      #   run: |
      #     source test_env/bin/activate 2>/dev/null || source test_env/Scripts/activate
      #     pytest test/ \
      #       -v \
      #       --tb=short \
      #       --import-mode=importlib \
      #       --cov=cooprecsys \
      #       --cov-report=xml:coverage.xml \
      #       --cov-report=term-missing \
      #       --junit-xml=test-results.xml
      #
      # - name: Upload coverage reports
      #   uses: codecov/codecov-action@v4
      #   if: always()
      #   with:
      #     files: ./coverage.xml
      #     flags: unittests
      #     name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
      #     fail_ci_if_error: false
      #     token: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------
  # Publish wheels + sdist to a GitHub Release
  # ---------------------------------------------------------------------
  publish:
    name: Publish to Release
    runs-on: ubuntu-latest
    needs: [build-sdist, test]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all wheels and sdist
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true

      - name: List final release artifacts
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          draft: false
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
          generate_release_notes: true

      - name: Release summary
        shell: bash
        run: |
          echo "Release published successfully for tag: ${{ github.ref_name }}"
          echo "Sdists published: $(ls -1 dist/*.tar.gz | wc -l)"
          echo "Wheels published: $(ls -1 dist/*.whl | wc -l)"