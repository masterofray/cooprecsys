name: Build & Release Wheel

on:
  push:
    branches:
      - main
      - Claude_dev
      - dev
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
      - Claude_dev
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  PIP_NO_INPUT: "1"
  CYTHON_COVERAGE: "0"

jobs:
  build:
    name: Build Wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Create UV cache directory
        run: mkdir -p "${{ env.UV_CACHE_DIR }}"

      - name: Set up uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install build dependencies via uv
        run: |
          uv pip install --system \
            setuptools>=70.0 \
            wheel>=0.42 \
            cython>=3.0 \
            numpy>=1.21 \
            build

      - name: Display Python & Build tool versions
        run: |
          python --version
          pip --version
          cython --version
          uv --version

      - name: Build wheel via uv
        run: |
          uv pip install --system build
          python -m build --wheel --outdir dist/

      - name: List generated artifacts
        run: |
          ls -lh dist/
          echo "Wheel artifact: $(basename dist/*.whl)"

      - name: Upload wheel as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-ubuntu-latest
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  test:
    name: Test Installed Wheel
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: wheels-ubuntu-latest
          path: dist/

      - name: Resolve wheel filename
        id: wheel_info
        run: |
          WHEEL_FILE=$(ls dist/*.whl | head -1)
          if [ -z "$WHEEL_FILE" ]; then
            echo "ERROR: No wheel file found in dist/"
            ls -la dist/
            exit 1
          fi
          WHEEL_NAME=$(basename "$WHEEL_FILE")
          echo "wheel_file=$WHEEL_FILE" >> $GITHUB_OUTPUT
          echo "wheel_name=$WHEEL_NAME" >> $GITHUB_OUTPUT
          echo "Resolved wheel: $WHEEL_NAME"

      - name: Create isolated test environment via uv
        run: |
          uv venv test_env --python ${{ env.PYTHON_VERSION }}

      - name: Install wheel into isolated environment
        run: |
          source test_env/bin/activate
          uv pip install "${{ steps.wheel_info.outputs.wheel_file }}"
          ./test_env/bin/python -c "import cooprecsys; print(f'cooprecsys loaded from: {cooprecsys.__file__}')"

      - name: Install test dependencies
        run: |
          source test_env/bin/activate
          uv pip install pytest pytest-cov

      - name: Debug Installation
        run: |
          echo "Content of site-packages:"
          ls -l test_env/lib/python3.10/site-packages/
          
          echo "Checking interpreter python:"
          ./test_env/bin/python -m pip list | grep cooprecsys

      - name: Run integration tests against wheel
        run: |
          source test_env/bin/activate
          
          # PENTING: Pindahkan direktori aktif ke luar root project atau ubah cara panggil pytest.
          # Jika Anda menguji cakupan kode (--cov=cooprecsys) langsung di root, pytest-cov 
          # secara default akan mengukur kode mentah di folder lokal, bukan kode yang terkompilasi (Cython) di wheel.
          # Kita gunakan flag --import-mode=importlib agar pytest memprioritaskan paket yang terpasang di test_env.
          pytest test/ \
            -v \
            --tb=short \
            --import-mode=importlib \
            --cov=cooprecsys \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --junit-xml=test-results.xml

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.xml
          flags: unittests
          name: coverage-${{ env.PYTHON_VERSION }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: test-results.xml
          check_name: "Test Results (${{ env.PYTHON_VERSION }})"

  publish:
    name: Publish to Release
    runs-on: ubuntu-latest
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: artifact* # Sesuaikan dengan nama artifact yang Anda buat di job build
          path: dist/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          draft: false
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
          generate_release_notes: true
          # GITHUB_TOKEN sudah disuntikkan otomatis oleh GitHub Actions

      - name: Release summary
        run: |
          echo "Release published successfully for tag: ${{ github.ref_name }}"
          echo "Wheels published: $(ls -1 dist/*.whl | wc -l)"