name: Documentation

on:
  push:
    branches:
      - master
      - staging
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-cooprecsys-docs
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Show tool versions
        run: |
          set -euo pipefail
          node --version
          npm --version
          npx astro --version
          npx pagefind --version

      - name: Build Astro site
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee astro-build.log

      - name: Build Pagefind search index
        run: |
          set -euo pipefail
          npm run build:search 2>&1 | tee pagefind-build.log

      - name: Validate generated site
        run: |
          set -euo pipefail

          test -f dist/index.html
          test -d dist/pagefind

          echo "Generated site:"
          find dist -maxdepth 2 -type f | sort | head -200

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
