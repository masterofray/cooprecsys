[build-system]
requires       = ["setuptools>=70.0",
                  "wheel>=0.42.0",
                  "cython>=3.0.0",
                  "numpy>=2.0.0; python_version>='3.10'"
                 ]
build-backend  = "setuptools.build_meta"

[project]
name           = "cooprecsys"
version        = "0.0.3"
description    = """
CoopRecSys (Koperasi Recommender System) is a \
high-performance recommendation engine designed \
for cooperative ecosystems. It features an \
ultra-optimized collaborative filtering core \
powered by Cython and OpenMP for parallel execution, \
combined with a Learning-to-Rank (LTR) framework \
using LightGBM. Engineered for speed, scalability, \
and high-accuracy personalized recommendations in \
resource-constrained or large-scale cooperative \
networks."""
readme          = "README.md"
requires-python = ">=3.10"
authors         = [{name = "Aryanto", email = "aryanto.dandan@gmail.com"}]
license         = "GPL-3.0-only"
classifiers     = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies    = ["cloudpickle>=3.0.0",
                   "numpy>=2.0.0",
                   "scipy>=1.13.0",
                   "scikit-learn>=1.5.0",
                   "mlflow>=2.15.0",
                   "duckdb>=1.0.0",
                   "Jinja2>=3.1.0",
                   "joblib>=1.4.0",
                   "lightgbm>=4.3.0",
                   "llvmlite>=0.42.0",
                   "matplotlib>=3.8.0",
                   "numba>=0.59.0",
                   "optuna>=3.6.0",
                   "pandas>=2.2.0,<3.0.0",
                   "psutil>=5.9.0",
                   "pyarrow>=15.0.0",
                   "seaborn>=0.13.0",
                   "shap>=0.45.0",
                   "tqdm>=4.66.0",
                  ]

[project.optional-dependencies]
dev             = ["Cython>=3.0.0",
                   "setuptools>=70.0",
                   "wheel>=0.42.0",
                   "pytest>=8.0.0",
                   "pytest-cov>=5.0.0",
                   "black>=24.0.0",
                   "flake8>=7.0.0",
                   "isort>=5.13.0",
                   "ipdb~=0.13",]
inference       = ["faiss-cpu>=1.8.0",
                   "annoy>=1.17.0",
                   "scann>=1.4.2; sys_platform == 'linux'",]

[tool.pytest.ini_options]
testpaths       = ["test"]
python_files    = ["ltrlgbm_example.py", "*_test.py", "t03_pytest.py", "t05_dashboard_refactor.py"]
addopts         = "-v --tb=short --cov=src --cov-report=xml --cov-report=term-missing"
log_cli         = true
log_cli_level   = "INFO"

[tool.coverage.run]
branch          = true
source          = ["src"]
omit            = ["*/site-packages/*", "*/__pycache__/*", "*/tests/*"]

[tool.coverage.report]
precision       = 2
show_missing    = true
skip_covered    = false
exclude_lines   = ["pragma: no cover",
                   "def __repr__",
                   "raise AssertionError",
                   "raise NotImplementedError",
                   "if __name__ == .__main__.:",
                   "if TYPE_CHECKING:",
                  ]

[tool.setuptools.package-dir]
""              = "src"

[tool.setuptools.packages.find]
where           = ["src"]

[tool.setuptools.package-data]
"*" = ["*.so", "*.pyd", "*.pxd", "*.pyx", "*.ini", "*.sql"]