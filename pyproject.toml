[build-system]
requires       = ["setuptools>=80.2.0", 
                  "wheel>=0.45.1",
                  "cython>=3.1.2",
                  "numpy>=2.2.6"
                 ]
build-backend  = "setuptools.build_meta"

[project]
name           = "cooprecsys"
version        = "0.0.1rc3"
description    = """
CoopRecSys (Koperasi Recommender System) is a \
high-performance recommendation engine designed \
for cooperative ecosystems. It features an \
ultra-optimized collaborative filtering core \
powered by Cython and OpenMP for parallel execution, \
combined with a Learning-to-Rank (LTR) framework \
using LightGBM. Engineered for speed, scalability, \
and high-accuracy personalized recommendations in \
resource-constrained or large-scale cooperative \
networks."""
readme          = "README.md"
requires-python = ">=3.8"
authors         = [{name = "Aryanto",
                    email = "aryanto.dandan@gmail.com"}]
license         = { text = "GPL-3.0" }
classifiers     = ["Development Status :: 4 - Beta",
                   "Intended Audience :: Developers",
                   "Programming Language :: Python :: 3",
                   "Topic :: Scientific/Engineering :: Artificial Intelligence",
                  ]
dependencies    = ["cloudpickle>=3.1.1",
                   "duckdb>=1.3.2",
                   "Jinja2>=3.1.6",
                   "joblib>=1.5.3",
                   "lightgbm>=4.6.0",
                   "matplotlib>=3.10.8",
                   "mlflow>=3.2.0",
                   "numpy>=2.2.6",
                   "optuna>=4.4.0",
                   "pandas>=3.0.1",
                   "pyarrow>=19.0.0",
                   "scann>=1.4.2",
                   "scikit-learn>=1.8.0",
                   "scipy>=1.17.1",
                   "seaborn>=0.13.2",
                   "shap>=0.51.0",
                   "tqdm>=4.67.1",
                  ]

[project.optional-dependencies]
dev             = ["Cython>=3.1.2",
                   "pytest>=8.4.1",
                   "ipdb~=0.13",
                  ]
inference       = ["faiss-cpu>=1.13.1",
                   "annoy>=1.17.3",
                  ]

[tool.pytest.ini_options]
testpaths       = ["test"]
python_files    = ["ltrlgbm_example.py", "*_test.py"]
addopts         = "-v --tb=short --cov=cooprecsys --cov-report=xml --cov-report=term-missing"
log_cli         = true
log_cli_level   = "INFO"

[tool.coverage.run]
branch          = true
source          = ["cooprecsys"]
omit            = ["*/site-packages/*", "*/__pycache__/*", "*/tests/*"]

[tool.coverage.report]
precision       = 2
show_missing    = true
skip_covered    = false
exclude_lines   = ["pragma: no cover",
                   "def __repr__",
                   "raise AssertionError",
                   "raise NotImplementedError",
                   "if __name__ == .__main__.:",
                   "if TYPE_CHECKING:",
                  ]