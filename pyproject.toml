[build-system]
requires = ["setuptools>=70.0", "wheel>=0.42", "cython>=3.0", "numpy>=1.21"]
build-backend = "setuptools.build_meta"

[project]
name = "cooprecsys"
version = "0.0.1rc"
description = "Koperasi Recommender System - Ultra-optimized collaborative filtering using Cython + OpenMP"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Aryanto", email = "aryanto.dandan@gmail.com" }]
license = { text = "GPL-3.0" }
dependencies = [
    "numpy>=1.21", "scipy>=1.7", "pandas>=1.3", "duckdb>=0.8",
    "tqdm>=4.60", "joblib>=1.1", "seaborn>=0.12", "lightgbm>=4.0.0",
    "xgboost>=2.0.0", "optuna>=3.5.0", "shap>=0.44.0", "faiss-cpu>=1.7.0",
    "annoy>=1.17.0", "mlflow>=2.0.0", "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "black>=23.0", "ruff>=0.1.0", "mypy>=1.0"]
test = ["pytest>=7.0", "pytest-cov>=4.0"]

[tool.pytest.ini_options]
testpaths = ["test", "tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short --cov=cooprecsys --cov-report=xml --cov-report=term-missing"
log_cli = true
log_cli_level = "INFO"

[tool.coverage.run]
branch = true
source = ["cooprecsys"]
omit = ["*/site-packages/*", "*/__pycache__/*", "*/tests/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]